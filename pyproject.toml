[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CubicGalileonEmu"
version = "0.0.2"
description = "GP emulator for boost factor in cubic Galileon gravity model"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nesar Ramachandra", email = "nramachandra@anl.gov" }]
# scipy<=1.10.1 has no wheels for Python 3.12+
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy",
    "scipy<=1.10.1",
    "sepia @ git+https://github.com/lanl/SEPIA.git",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
examples = ["jupyter", "matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/LSSTDESC/CubicGalileonEmu"

[tool.setuptools]
packages = ["CubicGalileonEmu"]

[tool.setuptools.package-data]
CubicGalileonEmu = ["data/*", "model/*"]
